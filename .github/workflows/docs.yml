name: Docs

# Ticket #262: documentation freshness. The check reads the canonical contract,
# host, and Node constants and fails when the current docs claim a stale
# version, the user navigation drops a docs section, a current verification
# record is missing from the evidence index, a page loses required frontmatter,
# an internal link or anchor breaks, or the generated reference or docs-site
# build drifts. Ticket #310 keeps this job separate from the Node and host
# matrices; the default `docs:check` includes the VitePress build, while unit
# fixture tests use the explicit `--skip-site-build` fast mode.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: docs:check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci
      - run: npm run docs:check
