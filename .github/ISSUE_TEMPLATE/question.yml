name: Support request
description: Ask for help with setup, configuration, or unclear behavior
title: "[Support]: "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Keep private data out.** Do not include credentials, passwords, API keys, tokens, cookies, conversation content, message or memory text, proprietary file bytes, or private absolute paths. Redact usernames, hostnames, project paths, and log lines before posting.

        Check the [support matrix and known limitations](https://github.com/heyimteee/ensemble/blob/main/docs/support/support-matrix.md) and the [incident runbook](https://github.com/heyimteee/ensemble/blob/main/docs/support/incident-runbook.md) first. Security vulnerabilities belong in the private process described in [SECURITY.md](https://github.com/heyimteee/ensemble/blob/main/SECURITY.md).

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe the goal and where you are stuck, using placeholder names.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: List the commands, documentation, or workarounds you already attempted.
      render: text
    validations:
      required: true

  - type: input
    id: ensemble-version
    attributes:
      label: Ensemble version
      description: The version shown by `opencode plugin list`, or the Git commit for a checkout.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - npm package (opencode plugin add)
        - Git package spec
        - Local checkout
        - Not installed yet
        - Other
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Output of `opencode --version`.
      placeholder: "e.g. 2.2.7"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: "e.g. v26.12.1"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and terminal
      description: OS and terminal host. macOS/Herdr is unverified and Windows is out of scope.
      placeholder: "e.g. Linux with tmux 3.5a, 120x40"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Commands and output, doctor exit code and mismatch codes, redacted logs, or a short screenshot description. Do not include conversation content or raw logs.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction and scope
      options:
        - label: I removed credentials, tokens, conversation content, memories, proprietary file bytes, and private absolute paths from this request.
          required: true
        - label: This is not a security vulnerability; vulnerabilities use the private process in SECURITY.md.
          required: true
        - label: I checked the support matrix and this request is on a supported or explicitly unverified configuration.
          required: true
